[project]
name = "qqbot"
version = "0.9.0"
description = "宿舍电费查询与用电分析 QQ 机器人"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.12,<4",
    "cryptography>=45",
    "Pillow>=11,<13",
    "python-dotenv>=1.1,<2",
]

[project.scripts]
qqbot = "qqbot.light_cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.25,<5",
    "mcp>=1.30,<2",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.12",
    "PyYAML>=6,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
